<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Privacy across layers: Network, Request, On-chain</title>
  <desc id="d">Three exposure layers. NODAL's current scope is the Request layer. The Network layer is not covered. The On-chain layer is covered only where an on-chain identifier appears inside a captured request.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d201a" stroke-width="1"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6F135" stop-opacity=".12"/><stop offset="1" stop-color="#C6F135" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="960" height="330" rx="10" fill="#0B0C0A"/>
  <rect width="960" height="330" rx="10" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="959" height="329" rx="10" fill="none" stroke="#32362C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#8D8B81">
    <text x="32" y="40">PRIVACY ACROSS LAYERS</text>
    <text x="928" y="40" text-anchor="end">NODAL · CURRENT SCOPE: REQUEST</text>
  </g>
  <!-- Network -->
  <rect x="32" y="64" width="268" height="226" rx="6" fill="#151713" stroke="#32362C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="94" font-size="11" fill="#8D8B81" letter-spacing="1.2">01 · NETWORK</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ECEAE2">
    <text x="52" y="126" font-size="20" font-weight="600">Connection metadata</text>
    <text x="52" y="156" font-size="13" fill="#B9B6AB">Source IP, timing, which hosts</text>
    <text x="52" y="175" font-size="13" fill="#B9B6AB">are contacted</text>
    <text x="52" y="204" font-size="12" fill="#8D8B81">Seen by: ISPs, Wi-Fi and VPN operators,</text>
    <text x="52" y="222" font-size="12" fill="#8D8B81">every receiving server</text>
  </g>
  <rect x="52" y="248" width="118" height="24" rx="3" fill="none" stroke="#32362C"/>
  <text x="111" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#B9B6AB">NOT COVERED</text>
  <!-- arrow -->
  <path d="M308 177h32m-8-6 8 6-8 6" fill="none" stroke="#C6F135" stroke-width="1.6"/>
  <!-- Request -->
  <rect x="346" y="64" width="268" height="226" rx="6" fill="#151713"/>
  <rect x="346" y="64" width="268" height="226" rx="6" fill="url(#glow)"/>
  <rect x="346" y="64" width="268" height="226" rx="6" fill="none" stroke="#C6F135" stroke-width="1.6"/>
  <rect x="346" y="64" width="268" height="3" fill="#C6F135"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="366" y="94" font-size="11" fill="#C6F135" letter-spacing="1.2">02 · REQUEST</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ECEAE2">
    <text x="366" y="126" font-size="20" font-weight="600">What the dApp sends</text>
    <text x="366" y="156" font-size="13" fill="#B9B6AB">Wallet addresses, tx hashes, ENS</text>
    <text x="366" y="175" font-size="13" fill="#B9B6AB">in URLs, headers and bodies</text>
    <text x="366" y="204" font-size="12" fill="#8D8B81">Seen by: analytics, replay, ads,</text>
    <text x="366" y="222" font-size="12" fill="#8D8B81">error tracking, RPC, the app's API</text>
  </g>
  <rect x="366" y="248" width="150" height="24" rx="3" fill="#C6F135"/>
  <text x="441" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" font-weight="700" fill="#1B2400">NODAL SCOPE</text>
  <!-- arrow -->
  <path d="M622 177h32m-8-6 8 6-8 6" fill="none" stroke="#C6F135" stroke-width="1.6"/>
  <!-- On-chain -->
  <rect x="660" y="64" width="268" height="226" rx="6" fill="#151713" stroke="#32362C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="680" y="94" font-size="11" fill="#8D8B81" letter-spacing="1.2">03 · ON-CHAIN</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ECEAE2">
    <text x="680" y="126" font-size="20" font-weight="600">Public ledger</text>
    <text x="680" y="156" font-size="13" fill="#B9B6AB">Addresses, balances, history,</text>
    <text x="680" y="175" font-size="13" fill="#B9B6AB">contract interactions</text>
    <text x="680" y="204" font-size="12" fill="#8D8B81">Seen by: anyone (explorers,</text>
    <text x="680" y="222" font-size="12" fill="#8D8B81">indexers, analytics firms)</text>
  </g>
  <rect x="680" y="248" width="176" height="24" rx="3" fill="none" stroke="#32362C" stroke-dasharray="3 3"/>
  <text x="768" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#B9B6AB">PARTIAL · VIA REQUESTS</text>
</svg>
